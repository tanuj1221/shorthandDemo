user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    multi_accept on;
    use epoll;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # Logging Settings
    ##
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    ##
    # Gzip Settings
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    ##
    # Rate Limiting
    ##
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    ##
    # Upstream for Flask App
    ##
    upstream flask_app {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    ##
    # Upstream for Shorthand Exam App (Port 3001)
    ##
    upstream shorthand_app {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    ##
    # Upstream for Yogineers Tech App (Port 5000)
    ##
    upstream yogineers_app {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    ##
    # Server Configuration for checking.shorthandonlineexam.in
    ##
    server {
        listen 80;
        server_name checking.shorthandonlineexam.in www.checking.shorthandonlineexam.in;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Root directory
        root /var/www/html;
        index index.html index.htm;

        # Client max body size
        client_max_body_size 50M;

        # Proxy settings for Flask app
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static files (if you have any)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri @proxy_to_app;
        }

        # Fallback to Flask app for static files
        location @proxy_to_app {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Block access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    ##
    # HTTP to HTTPS redirect for shorthandexam.in
    ##
    server {
        listen 80;
        listen [::]:80;
        server_name shorthandexam.in www.shorthandexam.in;
        return 301 https://www.shorthandexam.in$request_uri;
    }

    ##
    # HTTPS redirect from non-www to www for shorthandexam.in
    ##
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name shorthandexam.in;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/shorthandexam.in.crt;
        ssl_certificate_key /etc/nginx/ssl/shorthandexam.in.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://www.shorthandexam.in$request_uri;
    }

    ##
    # Server Configuration for www.shorthandexam.in with SSL (Port 3001)
    ##
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.shorthandexam.in;

        # Client max body size
        client_max_body_size 100M;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/shorthandexam.in.crt;
        ssl_certificate_key /etc/nginx/ssl/shorthandexam.in.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL optimization
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # HSTS (uncomment if you're sure)
        # add_header Strict-Transport-Security "max-age=63072000" always;

        # Proxy settings for Shorthand Exam app
        location / {
            proxy_pass http://shorthand_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    ##
    # HTTP to HTTPS redirect for dev.shorthandexam.in (NEW)
    ##
    server {
        listen 80;
        listen [::]:80;
        server_name dev.shorthandexam.in;
        
        # Allow certbot to verify domain
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    ##
    # Server Configuration for dev.shorthandexam.in with SSL (Port 3001) (NEW)
    ##
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name dev.shorthandexam.in;

        # Client max body size
        client_max_body_size 100M;

        # SSL Configuration (certbot will add/update these)
        ssl_certificate /etc/letsencrypt/live/dev.shorthandexam.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.shorthandexam.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL optimization
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # HSTS (uncomment if you're sure)
        # add_header Strict-Transport-Security "max-age=63072000" always;

        # Proxy settings for Shorthand Exam app (same backend as production)
        location / {
            proxy_pass http://shorthand_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    ##
    # HTTP to HTTPS redirect for yogineerstech.in
    ##
    server {
        listen 80;
        listen [::]:80;
        server_name yogineerstech.in www.yogineerstech.in;
        return 301 https://www.yogineerstech.in$request_uri;
    }

    ##
    # HTTPS redirect from non-www to www for yogineerstech.in
    ##
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name yogineerstech.in;

        # SSL Configuration (certbot will add these)
        ssl_certificate /etc/letsencrypt/live/yogineerstech.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yogineerstech.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://www.yogineerstech.in$request_uri;
    }

    ##
    # Server Configuration for www.yogineerstech.in with SSL (Port 5000)
    ##
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.yogineerstech.in;

        # Client max body size
        client_max_body_size 100M;

        # SSL Configuration (certbot will add these)
        ssl_certificate /etc/letsencrypt/live/yogineerstech.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yogineerstech.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL optimization
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # HSTS (uncomment if you're sure)
        # add_header Strict-Transport-Security "max-age=63072000" always;

        # Proxy settings for Yogineers Tech app
        location / {
            proxy_pass http://yogineers_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Default server block to handle requests without proper Host header
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}
