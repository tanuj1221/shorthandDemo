    ##
    # HTTP to HTTPS redirect for dev.shorthandexam.in (STEP 1 - HTTP ONLY)
    ##
    server {
        listen 80;
        listen [::]:80;
        server_name dev.shorthandexam.in;
        
        # Allow certbot to verify domain
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }
        
        # Temporarily allow all traffic (will redirect to HTTPS after SSL is obtained)
        location / {
            proxy_pass http://shorthand_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

